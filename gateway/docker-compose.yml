# Gateway core: New API + PostgreSQL + Redis + Caddy (TLS tự động).
# Chạy:  cp .env.example .env  &&  ./scripts/gen-secrets.sh  &&  docker compose up -d
# Bật thêm dịch vụ nạp tiền / website / giám sát bằng profile:
#   docker compose --profile payment --profile web --profile monitoring up -d
#
# New API được dùng NGUYÊN BẢN (image chính thức, không sửa code) để không
# phát sinh nghĩa vụ công khai mã nguồn theo AGPLv3.

name: gateway

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  new-api:
    # Ghim bản ổn định. Bản v1.0.0-rc.* đổi cơ chế đăng nhập (JWT + refresh cookie,
    # bỏ header New-Api-User) và sẽ làm hỏng website/payment nếu nâng cấp mù.
    image: calciumion/new-api:${NEWAPI_VERSION:-v0.13.2}
    container_name: new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    environment:
      SQL_DSN: postgresql://newapi:${POSTGRES_PASSWORD}@postgres:5432/newapi
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GIN_MODE: release
      NODE_NAME: new-api-node-1
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      # Mô hình suy luận lâu: cho phép stream im lặng tới 10 phút.
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-600}
      # Tự kiểm tra kênh mỗi N phút (tắt kênh lỗi, bật lại kênh đã khỏe).
      CHANNEL_TEST_FREQUENCY: ${CHANNEL_TEST_FREQUENCY:-30}
      # Giới hạn tốc độ theo IP (website BFF phải chuyển tiếp X-Forwarded-For).
      GLOBAL_API_RATE_LIMIT: ${GLOBAL_API_RATE_LIMIT:-600}
      GLOBAL_API_RATE_LIMIT_DURATION: "180"
      GLOBAL_WEB_RATE_LIMIT: ${GLOBAL_WEB_RATE_LIMIT:-120}
      GLOBAL_WEB_RATE_LIMIT_DURATION: "180"
      MEMORY_CACHE_ENABLED: "true"
      SYNC_FREQUENCY: "60"
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    ports:
      # Chỉ mở cho máy chủ (dùng cho scripts/newapi_admin.py và SSH tunnel).
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [gateway]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newapi
      # Dùng bởi postgres/init/01-payments.sh để tạo DB riêng cho dịch vụ nạp tiền.
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d newapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gateway]
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [gateway]
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN}
      PAY_DOMAIN: ${PAY_DOMAIN:-pay.localhost}
      WEB_DOMAIN: ${WEB_DOMAIN:-web.localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - new-api
    networks: [gateway]
    logging: *logging

  # ---- Dịch vụ nạp tiền USDT/BTC (thread "Nạp tiền"), bật bằng --profile payment ----
  payment:
    profiles: ["payment"]
    build: ${PAYMENT_BUILD_CONTEXT:-../payment}
    container_name: payment
    restart: unless-stopped
    env_file: .env
    environment:
      NEWAPI_INTERNAL_URL: http://new-api:3000
      PAYMENTS_DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments
      PORT: "8080"
      PUBLIC_URL: https://${PAY_DOMAIN}
      SITE_URL: https://${WEB_DOMAIN}
    # Healthcheck định nghĩa trong ../payment/Dockerfile (GET /healthz).
    depends_on:
      new-api:
        condition: service_healthy
    networks: [gateway]
    logging: *logging

  # ---- Website Next.js (thread "Website"), bật bằng --profile web ----
  # Bỏ qua nếu website chạy trên Vercel.
  web:
    profiles: ["web"]
    build: ${WEB_BUILD_CONTEXT:-../web}
    container_name: web
    restart: unless-stopped
    env_file: .env
    environment:
      NEWAPI_URL: http://new-api:3000
      PAYMENT_INTERNAL_URL: http://payment:8080
      PORT: "3000"
    depends_on:
      new-api:
        condition: service_healthy
    networks: [gateway]
    logging: *logging

  # ---- Giám sát, bật bằng --profile monitoring; mở qua SSH tunnel cổng 3001 ----
  uptime-kuma:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks: [gateway]
    logging: *logging

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  gateway:
    # Tên cố định để dự án compose khác có thể tham gia: networks: { gateway: { external: true } }
    name: gateway
